<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 1500" width="1150" height="1500" font-family="Calibri, Arial, sans-serif">
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2E74B5"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1BAF7A"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1150" height="1500" fill="#FFFFFF"/>

  <!-- Titre -->
  <text x="20" y="30" font-size="21" font-weight="bold" fill="#1F3864">Logigramme de discrimination et de décision</text>
  <text x="20" y="52" font-size="13" font-style="italic" fill="#1A1A1A">Chaque conclusion est consignée dans la fiche de vie du capteur (annexe F).</text>

  <!-- Légende couleurs -->
  <g font-size="12" fill="#1A1A1A">
    <line x1="800" y1="24" x2="840" y2="24" stroke="#2E74B5" stroke-width="3"/>
    <polygon points="840,18 852,24 840,30" fill="#2E74B5"/>
    <text x="858" y="28">Absent (test suivant)</text>
    <line x1="800" y1="46" x2="840" y2="46" stroke="#1BAF7A" stroke-width="3"/>
    <polygon points="840,40 852,46 840,52" fill="#1BAF7A"/>
    <text x="858" y="50">Présent (conclusion)</text>
  </g>

  <!-- Point d'entrée -->
  <rect x="110" y="78" width="420" height="56" rx="28" fill="#1F3864"/>
  <text x="320" y="111.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Alarme CUSUM ou EWMA déclenchée</text>
  <path d="M320,134 L320,169.0" fill="none" stroke="#2E74B5" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <!-- ============ TEST 1 ============ -->
  <g font-size="11.5" font-style="italic" fill="#1F3864">
    <text x="15" y="235">Grandeur : différence</text>
    <text x="15" y="251">entre les deux voies</text>
    <text x="15" y="267">en ligne droite</text>
  </g>
  <polygon points="320,175 460,255 320,335 180,255" fill="#1F3864" stroke="#2E74B5" stroke-width="2"/>
  <text x="320" y="245" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">TEST 1</text>
  <text x="320" y="268" text-anchor="middle" font-size="13" fill="#FFFFFF">Écart gauche/droite</text>
  <path d="M466,255 L554,255" fill="none" stroke="#1BAF7A" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="510" y="245" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1BAF7A">Présent</text>
  <rect x="560" y="185" width="520" height="140" rx="8" fill="#EAF9F3" stroke="#1BAF7A" stroke-width="2"/>
  <text x="580" y="210" font-size="14.5" font-weight="bold" fill="#1BAF7A">Dérive d'une des deux voies</text>
  <text x="580" y="232" font-size="13" fill="#1A1A1A">Identifier la voie concernée par</text>
  <text x="580" y="250" font-size="13" fill="#1A1A1A">l'historique de zéro.</text>
  <text x="580" y="276" font-size="13" font-weight="bold" fill="#1A1A1A">Action :</text>
  <text x="580" y="296" font-size="13" fill="#1A1A1A">Contrôle N1 immédiat (relevé de zéro),</text>
  <text x="580" y="314" font-size="13" fill="#1A1A1A">consignation dans la fiche de vie.</text>
  <path d="M320,335 L320,399" fill="none" stroke="#2E74B5" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="338" y="371" font-size="12.5" font-weight="bold" fill="#2E74B5">Absent</text>

  <!-- ============ TEST 2 ============ -->
  <g font-size="11.5" font-style="italic" fill="#1F3864">
    <text x="15" y="465">Grandeur : zéro relevé</text>
    <text x="15" y="481">avant/après essai,</text>
    <text x="15" y="497">comparé à l'historique</text>
  </g>
  <polygon points="320,405 460,485 320,565 180,485" fill="#1F3864" stroke="#2E74B5" stroke-width="2"/>
  <text x="320" y="475" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">TEST 2</text>
  <text x="320" y="498" text-anchor="middle" font-size="13" fill="#FFFFFF">Historique de zéro</text>
  <path d="M466,485 L554,485" fill="none" stroke="#1BAF7A" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="510" y="475" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1BAF7A">Présent</text>
  <rect x="560" y="415" width="520" height="140" rx="8" fill="#EAF9F3" stroke="#1BAF7A" stroke-width="2"/>
  <text x="580" y="440" font-size="14.5" font-weight="bold" fill="#1BAF7A">Dérive de zéro confirmée</text>
  <text x="580" y="462" font-size="13" fill="#1A1A1A">sur la ou les voies concernées.</text>
  <text x="580" y="488" font-size="13" font-weight="bold" fill="#1A1A1A">Action :</text>
  <text x="580" y="508" font-size="13" fill="#1A1A1A">Programmation d'un étalonnage de</text>
  <text x="580" y="526" font-size="13" fill="#1A1A1A">vérification (N3).</text>
  <path d="M320,565 L320,629" fill="none" stroke="#2E74B5" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="338" y="601" font-size="12.5" font-weight="bold" fill="#2E74B5">Absent</text>

  <!-- ============ TEST 3 ============ -->
  <g font-size="11.5" font-style="italic" fill="#1F3864">
    <text x="15" y="695">Grandeur : valeur restituée</text>
    <text x="15" y="711">pour un déséquilibre</text>
    <text x="15" y="727">de pont connu</text>
  </g>
  <polygon points="320,635 460,715 320,795 180,715" fill="#1F3864" stroke="#2E74B5" stroke-width="2"/>
  <text x="320" y="705" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">TEST 3</text>
  <text x="320" y="728" text-anchor="middle" font-size="13" fill="#FFFFFF">Étalonnage de shunt</text>
  <path d="M466,715 L554,715" fill="none" stroke="#1BAF7A" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="510" y="705" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1BAF7A">Présent</text>
  <rect x="560" y="645" width="520" height="140" rx="8" fill="#EAF9F3" stroke="#1BAF7A" stroke-width="2"/>
  <text x="580" y="670" font-size="14.5" font-weight="bold" fill="#1BAF7A">Dérive de la chaîne électronique</text>
  <text x="580" y="692" font-size="13" fill="#1A1A1A">en aval du pont.</text>
  <text x="580" y="718" font-size="13" font-weight="bold" fill="#1A1A1A">Action :</text>
  <text x="580" y="738" font-size="13" fill="#1A1A1A">Contrôle N2 de l'électronique rotor et</text>
  <text x="580" y="756" font-size="13" fill="#1A1A1A">de la chaîne d'acquisition.</text>
  <path d="M320,795 L320,859" fill="none" stroke="#2E74B5" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="338" y="831" font-size="12.5" font-weight="bold" fill="#2E74B5">Absent</text>

  <!-- ============ TEST 4 ============ -->
  <g font-size="11.5" font-style="italic" fill="#1F3864">
    <text x="15" y="925">Grandeur : écart analysé</text>
    <text x="15" y="941">par tranche de</text>
    <text x="15" y="957">température capteur</text>
  </g>
  <polygon points="320,865 460,945 320,1025 180,945" fill="#1F3864" stroke="#2E74B5" stroke-width="2"/>
  <text x="320" y="935" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">TEST 4</text>
  <text x="320" y="958" text-anchor="middle" font-size="13" fill="#FFFFFF">Dépendance thermique</text>
  <path d="M466,945 L554,945" fill="none" stroke="#1BAF7A" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="510" y="935" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1BAF7A">Présent</text>
  <rect x="560" y="875" width="520" height="140" rx="8" fill="#EAF9F3" stroke="#1BAF7A" stroke-width="2"/>
  <text x="580" y="900" font-size="14.5" font-weight="bold" fill="#1BAF7A">Dérive thermique</text>
  <text x="580" y="922" font-size="13" fill="#1A1A1A">Vérifier la compensation et les</text>
  <text x="580" y="940" font-size="13" fill="#1A1A1A">conditions d'emploi.</text>
  <text x="580" y="966" font-size="13" font-weight="bold" fill="#1A1A1A">Action :</text>
  <text x="580" y="986" font-size="13" fill="#1A1A1A">Vérification N2 de l'implantation et de</text>
  <text x="580" y="1004" font-size="13" fill="#1A1A1A">la compensation thermique.</text>
  <path d="M320,1025 L320,1089" fill="none" stroke="#2E74B5" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="338" y="1061" font-size="12.5" font-weight="bold" fill="#2E74B5">Absent</text>

  <!-- ============ TEST 5 ============ -->
  <g font-size="11.5" font-style="italic" fill="#1F3864">
    <text x="15" y="1155">Grandeur : écart analysé</text>
    <text x="15" y="1171">par mode hybride et</text>
    <text x="15" y="1187">par état de charge</text>
  </g>
  <polygon points="320,1095 460,1175 320,1255 180,1175" fill="#1F3864" stroke="#2E74B5" stroke-width="2"/>
  <text x="320" y="1165" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">TEST 5</text>
  <text x="320" y="1188" text-anchor="middle" font-size="13" fill="#FFFFFF">Dépendance au mode</text>
  <path d="M466,1175 L554,1175" fill="none" stroke="#1BAF7A" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="510" y="1165" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1BAF7A">Présent</text>
  <rect x="560" y="1105" width="520" height="140" rx="8" fill="#EAF9F3" stroke="#1BAF7A" stroke-width="2"/>
  <text x="580" y="1130" font-size="14.5" font-weight="bold" fill="#1BAF7A">Erreur du modèle d'estimation,</text>
  <text x="580" y="1152" font-size="13" fill="#1A1A1A">pas du capteur.</text>
  <text x="580" y="1178" font-size="13" font-weight="bold" fill="#1A1A1A">Action :</text>
  <text x="580" y="1198" font-size="13" fill="#1A1A1A">Signalement à l'équipe calculateur,</text>
  <text x="580" y="1216" font-size="13" fill="#1A1A1A">aucune action sur le capteur.</text>
  <path d="M320,1255 L320,1319" fill="none" stroke="#2E74B5" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="338" y="1291" font-size="12.5" font-weight="bold" fill="#2E74B5">Absent</text>

  <!-- ============ CONCLUSION FINALE (absent au test 5) ============ -->
  <rect x="180" y="1325" width="520" height="130" rx="8" fill="#EAF9F3" stroke="#1BAF7A" stroke-width="2"/>
  <text x="200" y="1355" font-size="14.5" font-weight="bold" fill="#1BAF7A">Écart non expliqué</text>
  <text x="200" y="1380" font-size="13" font-weight="bold" fill="#1A1A1A">Action :</text>
  <text x="200" y="1400" font-size="13" fill="#1A1A1A">Programmer un étalonnage de vérification (N3).</text>
</svg>

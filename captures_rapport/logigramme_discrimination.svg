<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 1610" width="1150" height="1610" font-family="Calibri, Arial, sans-serif">
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2E74B5"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1BAF7A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1150" height="1610" fill="#FFFFFF"/>

  <!-- Titre -->
  <text x="20" y="30" font-size="21" font-weight="bold" fill="#1F3864">Logigramme de discrimination et de décision</text>
  <text x="20" y="52" font-size="13" font-style="italic" fill="#1A1A1A">Chaque conclusion est consignée dans la fiche de vie du capteur (annexe F).</text>

  <!-- Légende couleurs -->
  <g font-size="12" fill="#1A1A1A">
    <line x1="800" y1="24" x2="840" y2="24" stroke="#2E74B5" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <text x="850" y="28">Absent (test suivant)</text>
    <line x1="800" y1="46" x2="840" y2="46" stroke="#1BAF7A" stroke-width="3" marker-end="url(#arrowGreen)"/>
    <text x="850" y="50">Présent (conclusion)</text>
  </g>

  <!-- Point d'entrée -->
  <rect x="130" y="78" width="380" height="62" rx="31" fill="#1F3864"/>
  <text x="320" y="103" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#FFFFFF">Alarme CUSUM ou EWMA déclenchée</text>
  <text x="320" y="122" text-anchor="middle" font-size="12.5" fill="#FFFFFF">(chapitre 6)</text>
  <path d="M320,140 L320,175" fill="none" stroke="#2E74B5" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <!-- ============ TEST 1 ============ -->
  <g font-size="11.5" font-style="italic" fill="#1F3864">
    <text x="15" y="270">Grandeur : différence</text>
    <text x="15" y="286">entre les deux voies</text>
    <text x="15" y="302">en ligne droite</text>
  </g>
  <polygon points="320,175 460,290 320,405 180,290" fill="#1F3864" stroke="#2E74B5" stroke-width="2"/>
  <text x="320" y="280" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">TEST 1</text>
  <text x="320" y="303" text-anchor="middle" font-size="13" fill="#FFFFFF">Écart gauche/droite</text>

  <path d="M460,290 L555,290" fill="none" stroke="#1BAF7A" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="507" y="280" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1BAF7A">Présent</text>

  <rect x="560" y="215" width="520" height="150" rx="8" fill="#EAF9F3" stroke="#1BAF7A" stroke-width="2"/>
  <text x="580" y="240" font-size="14.5" font-weight="bold" fill="#1BAF7A">Dérive d'une des deux voies</text>
  <text x="580" y="262" font-size="13" fill="#1A1A1A">Identifier la voie concernée par</text>
  <text x="580" y="280" font-size="13" fill="#1A1A1A">l'historique de zéro.</text>
  <text x="580" y="306" font-size="13" font-weight="bold" fill="#1A1A1A">Action :</text>
  <text x="580" y="326" font-size="13" fill="#1A1A1A">Contrôle N1 immédiat (relevé de zéro),</text>
  <text x="580" y="344" font-size="13" fill="#1A1A1A">consignation dans la fiche de vie.</text>

  <path d="M320,405 L320,440" fill="none" stroke="#2E74B5" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="352" y="427" font-size="12.5" font-weight="bold" fill="#2E74B5">Absent</text>

  <!-- ============ TEST 2 ============ -->
  <g font-size="11.5" font-style="italic" fill="#1F3864">
    <text x="15" y="510">Grandeur : zéro relevé</text>
    <text x="15" y="526">avant/après essai,</text>
    <text x="15" y="542">comparé à l'historique</text>
  </g>
  <polygon points="320,415 460,530 320,645 180,530" fill="#1F3864" stroke="#2E74B5" stroke-width="2"/>
  <text x="320" y="520" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">TEST 2</text>
  <text x="320" y="543" text-anchor="middle" font-size="13" fill="#FFFFFF">Historique de zéro</text>

  <path d="M460,530 L555,530" fill="none" stroke="#1BAF7A" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="507" y="520" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1BAF7A">Présent</text>

  <rect x="560" y="455" width="520" height="150" rx="8" fill="#EAF9F3" stroke="#1BAF7A" stroke-width="2"/>
  <text x="580" y="484" font-size="14.5" font-weight="bold" fill="#1BAF7A">Dérive de zéro confirmée</text>
  <text x="580" y="506" font-size="13" fill="#1A1A1A">sur la ou les voies concernées.</text>
  <text x="580" y="536" font-size="13" font-weight="bold" fill="#1A1A1A">Action :</text>
  <text x="580" y="556" font-size="13" fill="#1A1A1A">Programmation d'un étalonnage de</text>
  <text x="580" y="574" font-size="13" fill="#1A1A1A">vérification (N3).</text>

  <path d="M320,645 L320,680" fill="none" stroke="#2E74B5" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="352" y="667" font-size="12.5" font-weight="bold" fill="#2E74B5">Absent</text>

  <!-- ============ TEST 3 ============ -->
  <g font-size="11.5" font-style="italic" fill="#1F3864">
    <text x="15" y="750">Grandeur : valeur restituée</text>
    <text x="15" y="766">pour un déséquilibre</text>
    <text x="15" y="782">de pont connu</text>
  </g>
  <polygon points="320,655 460,770 320,885 180,770" fill="#1F3864" stroke="#2E74B5" stroke-width="2"/>
  <text x="320" y="760" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">TEST 3</text>
  <text x="320" y="783" text-anchor="middle" font-size="13" fill="#FFFFFF">Étalonnage de shunt</text>

  <path d="M460,770 L555,770" fill="none" stroke="#1BAF7A" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="507" y="760" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1BAF7A">Présent</text>

  <rect x="560" y="695" width="520" height="150" rx="8" fill="#EAF9F3" stroke="#1BAF7A" stroke-width="2"/>
  <text x="580" y="724" font-size="14.5" font-weight="bold" fill="#1BAF7A">Dérive de la chaîne électronique</text>
  <text x="580" y="744" font-size="13" fill="#1A1A1A">en aval du pont.</text>
  <text x="580" y="774" font-size="13" font-weight="bold" fill="#1A1A1A">Action :</text>
  <text x="580" y="794" font-size="13" fill="#1A1A1A">Contrôle N2 de l'électronique rotor et</text>
  <text x="580" y="812" font-size="13" fill="#1A1A1A">de la chaîne d'acquisition.</text>

  <path d="M320,885 L320,920" fill="none" stroke="#2E74B5" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="352" y="907" font-size="12.5" font-weight="bold" fill="#2E74B5">Absent</text>

  <!-- ============ TEST 4 ============ -->
  <g font-size="11.5" font-style="italic" fill="#1F3864">
    <text x="15" y="990">Grandeur : écart analysé</text>
    <text x="15" y="1006">par tranche de</text>
    <text x="15" y="1022">température capteur</text>
  </g>
  <polygon points="320,895 460,1010 320,1125 180,1010" fill="#1F3864" stroke="#2E74B5" stroke-width="2"/>
  <text x="320" y="1000" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">TEST 4</text>
  <text x="320" y="1023" text-anchor="middle" font-size="13" fill="#FFFFFF">Dépendance thermique</text>

  <path d="M460,1010 L555,1010" fill="none" stroke="#1BAF7A" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="507" y="1000" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1BAF7A">Présent</text>

  <rect x="560" y="935" width="520" height="150" rx="8" fill="#EAF9F3" stroke="#1BAF7A" stroke-width="2"/>
  <text x="580" y="964" font-size="14.5" font-weight="bold" fill="#1BAF7A">Dérive thermique</text>
  <text x="580" y="986" font-size="13" fill="#1A1A1A">Vérifier la compensation et les</text>
  <text x="580" y="1004" font-size="13" fill="#1A1A1A">conditions d'emploi.</text>
  <text x="580" y="1030" font-size="13" font-weight="bold" fill="#1A1A1A">Action :</text>
  <text x="580" y="1050" font-size="13" fill="#1A1A1A">Vérification N2 de l'implantation et de</text>
  <text x="580" y="1068" font-size="13" fill="#1A1A1A">la compensation thermique.</text>

  <path d="M320,1125 L320,1160" fill="none" stroke="#2E74B5" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="352" y="1147" font-size="12.5" font-weight="bold" fill="#2E74B5">Absent</text>

  <!-- ============ TEST 5 ============ -->
  <g font-size="11.5" font-style="italic" fill="#1F3864">
    <text x="15" y="1230">Grandeur : écart analysé</text>
    <text x="15" y="1246">par mode hybride et</text>
    <text x="15" y="1262">par état de charge</text>
  </g>
  <polygon points="320,1135 460,1250 320,1365 180,1250" fill="#1F3864" stroke="#2E74B5" stroke-width="2"/>
  <text x="320" y="1240" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">TEST 5</text>
  <text x="320" y="1263" text-anchor="middle" font-size="13" fill="#FFFFFF">Dépendance au mode</text>

  <path d="M460,1250 L555,1250" fill="none" stroke="#1BAF7A" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="507" y="1240" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1BAF7A">Présent</text>

  <rect x="560" y="1175" width="520" height="150" rx="8" fill="#EAF9F3" stroke="#1BAF7A" stroke-width="2"/>
  <text x="580" y="1204" font-size="14.5" font-weight="bold" fill="#1BAF7A">Erreur du modèle d'estimation,</text>
  <text x="580" y="1224" font-size="13" fill="#1A1A1A">pas du capteur.</text>
  <text x="580" y="1254" font-size="13" font-weight="bold" fill="#1A1A1A">Action :</text>
  <text x="580" y="1274" font-size="13" fill="#1A1A1A">Signalement à l'équipe calculateur,</text>
  <text x="580" y="1292" font-size="13" fill="#1A1A1A">aucune action sur le capteur.</text>

  <path d="M320,1365 L320,1400" fill="none" stroke="#2E74B5" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="352" y="1387" font-size="12.5" font-weight="bold" fill="#2E74B5">Absent</text>

  <!-- ============ CONCLUSION FINALE (absent au test 5) ============ -->
  <rect x="180" y="1405" width="520" height="130" rx="8" fill="#EAF9F3" stroke="#1BAF7A" stroke-width="2"/>
  <text x="200" y="1435" font-size="14.5" font-weight="bold" fill="#1BAF7A">Écart non expliqué</text>
  <text x="200" y="1460" font-size="13" font-weight="bold" fill="#1A1A1A">Action :</text>
  <text x="200" y="1480" font-size="13" fill="#1A1A1A">Programmer un étalonnage de vérification (N3).</text>

</svg>
